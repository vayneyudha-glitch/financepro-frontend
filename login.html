    <style>
        /* =========================================================
           FINANCEPRO LOGIN — CHROME SAFE VERSION
           ========================================================= */

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* =========================================================
           LOGIN BACKGROUND
           ========================================================= */

        .auth-page {
            position: relative !important;
            z-index: 1 !important;
            isolation: isolate;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 32px;
            overflow: hidden;
        }

        /* Grid */
        .auth-bg-grid {
            position: fixed !important;
            inset: 0;
            z-index: 0 !important;
            pointer-events: none !important;

            background-image:
                radial-gradient(
                    rgba(148, 163, 184, 0.18) 1px,
                    transparent 1px
                );

            background-size: 24px 24px;
            opacity: 0.45;
        }

        /* SVG background layer */
        .auth-bg-layer {
            position: fixed !important;
            inset: 0;
            z-index: 1 !important;
            pointer-events: none !important;
            overflow: hidden;
        }

        .auth-bg-layer svg {
            position: absolute;
            display: block;
        }

        .auth-bg-bar {
            top: 7%;
            left: 3%;
            width: 290px;
            height: 330px;
            opacity: 0.92;
            animation: floatY 6s ease-in-out infinite;
        }

        .auth-bg-line {
            top: 5%;
            right: 4%;
            width: 330px;
            height: 210px;
            opacity: 0.92;
            animation: floatY 7s ease-in-out infinite reverse;
        }

        .auth-bg-donut {
            bottom: 7%;
            right: 5%;
            width: 250px;
            height: 250px;
            opacity: 0.92;
            animation: floatY 8s ease-in-out infinite;
        }

        .auth-bg-stat {
            bottom: 6%;
            left: 5%;
            width: 270px;
            height: 135px;
            opacity: 0.92;
            animation: floatY 7.5s ease-in-out infinite;
        }

        .auth-bg-candle {
            top: 40%;
            left: 38%;
            width: 220px;
            height: 160px;
            opacity: 0.55;
            animation: floatY 9s ease-in-out infinite;
        }

        @keyframes floatY {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }

        /* =========================================================
           LOGIN CARD
           ========================================================= */

        .auth-card {
            position: relative !important;
            z-index: 10 !important;

            width: min(460px, calc(100vw - 48px));
            max-width: 460px;
            margin: 0 auto;

            box-sizing: border-box;
            flex-shrink: 0;

            background: rgba(255, 255, 255, 0.97);

            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);

            border-radius: 16px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .auth-header,
        .auth-card .quick-login,
        .auth-card .auth-form,
        .auth-card .auth-footer {
            position: relative;
            z-index: 11;
        }

        .auth-card button,
        .auth-card input,
        .auth-card a {
            position: relative;
            z-index: 12;
        }

        /* =========================================================
           QUICK LOGIN
           ========================================================= */

        .quick-login {
            width: 100%;
            box-sizing: border-box;
        }

        .quick-login-row {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .quick-login-btn {
            min-height: 44px;
            box-sizing: border-box;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 900px) {
            .auth-bg-bar {
                width: 190px;
                height: 210px;
                opacity: 0.55;
            }

            .auth-bg-line {
                width: 210px;
                height: 135px;
                opacity: 0.55;
            }

            .auth-bg-donut {
                width: 170px;
                height: 170px;
                opacity: 0.55;
            }

            .auth-bg-stat {
                width: 190px;
                height: 95px;
                opacity: 0.55;
            }

            .auth-bg-candle {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .auth-page {
                min-height: 100dvh;
                padding: 20px 12px;
            }

            .auth-card {
                width: 100%;
                max-width: 460px;
                padding: 28px 22px;
            }

            .quick-login-row {
                grid-template-columns: 1fr;
            }

            .auth-bg-bar,
            .auth-bg-line,
            .auth-bg-donut,
            .auth-bg-stat,
            .auth-bg-candle,
            .auth-bg-grid {
                display: none !important;
            }
        }
    </style>
</head>

    <script>

        /* =====================================================
           REDIRECT IF ALREADY LOGGED IN
           ===================================================== */

        if (typeof redirectIfLoggedIn === 'function') {

            redirectIfLoggedIn();

        } else if (typeof isLoggedIn === 'function' && isLoggedIn()) {

            window.location.replace(
                isAdmin()
                    ? 'admin.html'
                    : 'dashboard.html'
            );

        }


        /* =====================================================
           LOGIN ERROR
           ===================================================== */

        function showLoginError(msg) {

            var el = document.getElementById('loginError');

            if (!el) return;

            el.textContent = msg;
            el.style.display = 'block';

        }


        function clearLoginError() {

            var el = document.getElementById('loginError');

            if (!el) return;

            el.textContent = '';
            el.style.display = 'none';

        }


        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        var passwordToggle =
            document.getElementById('passwordToggle');

        if (passwordToggle) {

            passwordToggle.addEventListener(
                'click',
                function () {

                    var input =
                        document.getElementById('loginPassword');

                    if (!input) return;

                    input.type =
                        input.type === 'password'
                            ? 'text'
                            : 'password';

                    this.textContent =
                        input.type === 'password'
                            ? '\uD83D\uDC41'
                            : '\uD83D\uDE48';

                }
            );

        }


        /* =====================================================
           GOOGLE CALLBACK
           ===================================================== */

        (function handleGoogleCallback() {

            var params =
                new URLSearchParams(window.location.search);

            var gToken =
                params.get('google_token');

            var gRole =
                params.get('google_role');

            var gErr =
                params.get('error');


            if (gErr) {

                var messages = {

                    google_not_configured:
                        'Google Login belum dikonfigurasi oleh administrator.',

                    google_denied:
                        'Google sign-in was cancelled.',

                    google_token_failed:
                        'Google authentication failed. Please try again.',

                    account_inactive:
                        'Your account is deactivated. Contact administrator.'

                };

                var msg =
                    messages[gErr] ||
                    ('Google login error: ' + gErr);

                if (typeof showToast === 'function') {
                    showToast(msg, 'error');
                }

                window.history.replaceState(
                    {},
                    '',
                    window.location.pathname
                );

                return;
            }


            if (gToken && gRole) {

                if (typeof setToken === 'function') {
                    setToken(gToken);
                }


                if (
                    typeof AuthAPI !== 'undefined' &&
                    AuthAPI.getMe
                ) {

                    AuthAPI.getMe().then(function (res) {

                        if (
                            res.ok &&
                            res.data &&
                            res.data.data
                        ) {

                            if (
                                typeof setSession === 'function'
                            ) {
                                setSession(res.data.data);
                            }

                            if (typeof showToast === 'function') {
                                showToast(
                                    'Google login successful!',
                                    'success'
                                );
                            }

                            window.history.replaceState(
                                {},
                                '',
                                window.location.pathname
                            );


                            setTimeout(function () {

                                window.location.replace(
                                    gRole === 'ADMIN'
                                        ? 'admin.html'
                                        : 'dashboard.html'
                                );

                            }, 400);

                        } else {

                            if (typeof showToast === 'function') {
                                showToast(
                                    'Google login failed to load profile.',
                                    'error'
                                );
                            }

                        }

                    });

                }

            }

        })();


        /* =====================================================
           QUICK LOGIN INFO
           ===================================================== */

        var QUICK_LOGIN_INFO = {
            adminEmail: null,
            demoUserEmail: null
        };


        (async function loadQuickLoginInfo() {

            try {

                var res =
                    await fetch('/api/auth/quick-login-info');

                var json =
                    await res.json();


                if (
                    json &&
                    json.success &&
                    json.data
                ) {

                    QUICK_LOGIN_INFO.adminEmail =
                        json.data.adminEmail;

                    QUICK_LOGIN_INFO.demoUserEmail =
                        json.data.demoUserEmail;

                }

            } catch (e) {

                console.warn(
                    'Quick login info unavailable:',
                    e
                );

            }

        })();


        /* =====================================================
           ADMIN / USER QUICK LOGIN
           ===================================================== */

        async function performQuickLogin(kind) {

            var email =
                kind === 'admin'
                    ? QUICK_LOGIN_INFO.adminEmail
                    : QUICK_LOGIN_INFO.demoUserEmail;


            if (!email) {

                var msg =
                    kind === 'admin'

                        ? 'Admin account is not configured. Set ADMIN_EMAIL in backend/.env and run npm run seed.'

                        : 'Demo user is not configured. Set DEMO_USER_EMAIL and DEMO_USER_PASSWORD in backend/.env and run npm run seed.';


                if (typeof showToast === 'function') {
                    showToast(msg, 'error');
                }

                return;
            }


            var identifier =
                document.getElementById('loginIdentifier');

            var password =
                document.getElementById('loginPassword');


            if (identifier) {
                identifier.value = email;
            }

            if (password) {
                password.value = '';
                password.focus();
            }


            clearLoginError();


            if (typeof showToast === 'function') {

                showToast(
                    'Email filled — enter your ' +
                    (kind === 'admin'
                        ? 'admin'
                        : 'user') +
                    ' password to sign in.',
                    'info'
                );

            }

        }


        var adminButton =
            document.getElementById('btnDemoAdmin');

        if (adminButton) {

            adminButton.addEventListener(
                'click',
                function () {
                    performQuickLogin('admin');
                }
            );

        }


        var userButton =
            document.getElementById('btnDemoUser');

        if (userButton) {

            userButton.addEventListener(
                'click',
                function () {
                    performQuickLogin('user');
                }
            );

        }


        /* =====================================================
           NORMAL LOGIN
           ===================================================== */

        var loginForm =
            document.getElementById('loginForm');


        if (loginForm) {

            loginForm.addEventListener(
                'submit',
                async function (e) {

                    e.preventDefault();

                    clearLoginError();


                    var identifier =
                        document
                            .getElementById('loginIdentifier')
                            .value
                            .trim();


                    var password =
                        document
                            .getElementById('loginPassword')
                            .value;


                    if (!identifier || !password) {

                        showLoginError(
                            'Please fill in all fields.'
                        );

                        return;

                    }


                    var btn =
                        this.querySelector(
                            'button[type="submit"]'
                        );


                    if (btn) {

                        btn.disabled = true;
                        btn.textContent = 'Loading...';

                    }


                    var result =
                        await AuthAPI.login(
                            identifier,
                            password
                        );


                    if (btn) {

                        btn.disabled = false;
                        btn.textContent = 'Login';

                    }


                    if (!result.ok) {

                        showLoginError(
                            result.data.message ||
                            'Login failed.'
                        );

                        return;

                    }


                    if (typeof showToast === 'function') {

                        showToast(
                            'Login successful!',
                            'success'
                        );

                    }


                    var session =
                        typeof getSession === 'function'
                            ? getSession()
                            : null;


                    setTimeout(function () {

                        window.location.replace(

                            session &&
                            session.role === 'ADMIN'

                                ? 'admin.html'

                                : 'dashboard.html'

                        );

                    }, 500);

                }
            );

        }

    </script>

</body>
